# Credentials come from the environment. Export them from docker/.env before running dbt.
lakehouse:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: gold
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
