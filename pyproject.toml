[project]
name = "lakehouse-pipeline"
version = "0.1.0"
description = "Batch lakehouse over NYC TLC trip records: Airflow, PySpark, Delta, dbt"
requires-python = ">=3.10"
dependencies = [
    "pyarrow",
    "requests",
]

[project.optional-dependencies]
databricks = ["databricks-sdk"]
# Runs PySpark on Databricks serverless. Do not install plain pyspark in the same environment.
spark = ["databricks-sdk", "databricks-connect>=17,<18", "great-expectations>=1.3,<2", "pandas"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
